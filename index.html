*{box-sizing:border-box}body{margin:0;background:#050912;color:#eefaff;font:14px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;background:linear-gradient(#050912dd,transparent)}h1{font-size:17px;letter-spacing:4px;margin:0;color:#9effeb}small{color:#8fa4bd}#stats{text-align:right;font-variant-numeric:tabular-nums}#bar{height:4px;background:#203449;margin-top:7px}#fill{height:100%;background:#70ffcd;width:100%}.panel{position:fixed;inset:0;display:grid;place-items:center;background:#03071399;backdrop-filter:blur(10px)}.card{width:min(510px,92vw);padding:30px;border:1px solid #57e9cf44;border-radius:24px;background:linear-gradient(135deg,#132033ee,#070d19f5);box-shadow:0 0 100px #16e8d51a}.eyebrow{letter-spacing:4px;color:#71ffda;font-size:11px}h2{font-size:clamp(34px,7vw,56px);line-height:1.04;margin:16px 0}p{line-height:1.6;color:#afbdd1}button,select{color:#efffff;background:#182c3e;border:1px solid #4f8a9766;border-radius:12px;padding:12px;font:inherit;cursor:pointer}button:hover{background:#245264}button:focus-visible{outline:2px solid #fff}.primary{background:#76f8cf;color:#062721;font-weight:800;width:100%;margin-top:12px}#upgrades{display:grid;gap:10px}#upgrades button{text-align:left}#upgrades b{display:block;font-size:17px;color:#8fffe2;margin-bottom:4px}footer{position:fixed;bottom:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;gap:8px}#pulse{background:#163f47;padding:16px 22px;border-color:#76f8cf;box-shadow:0 0 30px #39eedc22}#notice{position:fixed;top:95px;width:100%;text-align:center;pointer-events:none;letter-spacing:2px;color:#8fffe2}#options{display:flex;gap:7px;flex-wrap:wrap;align-items:center}#help{font-size:11px;color:#a5b5c9;margin-top:5px}.hidden{display:none!important}@media(max-width:500px){header{padding:12px}#stats{font-s </style><canvas id="c"></canvas><header><div><h1>STORMHEART</h1><small>REACTOR SURVIVAL / ENDLESS</small><div id="bar"><div id="fill"></div></div></div><div id="stats"></div></header><div id="notice"></div><footer><div><div id="options"><button id="pause">Ⅱ</button><button id="audio">Sound off</button><select id="quality" aria-label="Graphics quality"><option value="1">Smooth</option><option value="2" selected>Storm</option><option value="4">Inferno</option></select><button id="full">⛶</button></div><div id="help">Drag to steer · WASD / arrows · Space: pulse</div></div><button id="pulse">PULSE</button></footer><div id="overlay" class="panel"><div class="card" id="card"></div></div>
<script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let W,H,dpr,mode='menu',t=0,last=0,fps=60,q=2,score=0,best=0,wave=1,kills=0,target=12,spawn=0,fire=0,pulseCD=0,transition=0,shake=0,sound=false,ac,player,enemies=[],bullets=[],sparks=[],gems=[],rings=[],keys={},pointer=null,stars=[];try{best=+localStorage.getItem('stormheart-best')||0}catch(e){}const rand=(a,b)=>a+Math.random()*(b-a),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1)}));if(player){player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(75,Math.min(H-70,player.y))}}onresize=resize;resize();function tone(hz,d=.07){if(!sound)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.connect(v);v.connect(ac.destination);o.frequency.setValueAtTime(hz,ac.currentTime);o.frequency.exponentialRampToValueAtTime(hz*.45,ac.currentTime+d);v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}function burst(x,y,color,n=20){for(let i=0;i<n*q&&sparks.length<1800;i++){let a=rand(0,Math.PI*2),s=rand(30,260);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.8),color})}}function show(html){$('card').innerHTML=html;$('overlay').classList.remove('hidden')}function menu(){show('<div class="eyebrow">ONE HEART. A THOUSAND HUNTERS.</div><h2>Outrun the<br>neon storm.</h2><p>Your Storm Manta spacecraft fires automatically. Keep moving, gather glowing shards, and build something unstoppable. Every fifth wave brings a leviathan.</p><p>Best run: <b>'+best.toLocaleString()+'</b> · Touch or keyboard</p><button class="primary" id="start">IGNITE REACTOR</button>');$('start').onclick=start}function st const upgrades=[['Twin storm','Add another projectile to every shot.',()=>player.multi=Math.min(7,player.multi+1)],['Hot core','Shots deal 35% more damage.',()=>player.damage*=1.35],['Rapid ignition','Fire 18% faster.',()=>player.rate=Math.max(.07,player.rate*.82)],['Rebuild the heart','Restore health and add 25 maximum health.',()=>{player.max+=25;player.hp=Math.min(player.max,player.hp+65)}],['Ghost engine','Move 20% faster.',()=>player.speed*=1.2],['Magnetic halo','Collect shards from much farther away.',()=>player.shield+=55]];function next(){mode='upgrade';let choices=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);show('<div class="eyebrow">WAVE '+wave+' CLEARED</div><h2>Evolve your core.</h2><p>Choose one upgrade. The swarm is growing.</p><div id="upgrades"></div>');for(let u of choices){let b=document.createElement('button');b.innerHTML='<b>'+u[0]+'</b>'+u[1];b.onclick=()=>{u[2]();wave++;kills=0;target=12+wave*4;spawn=1;mode='play';player.inv=2;transition=0;$('overlay').classList.add('hidden');$('notice').textContent='WAVE '+wave;tone(500,.2)};$('upgrades').append(b)}}function end(){mode='dead';best=Math.max(best,Math.floor(score));try{localStorage.setItem('stormheart-best',best)}catch(e){}show('<div class="eyebrow">THE STORM REMEMBERS</div><h2>A glorious<br>overload.</h2><p>Wave '+wave+' · Score <b>'+Math.floor(score).toLocaleString()+'</b><br>Best '+best.toLocaleString()+'</p><button id="again" class="primary">REIGNITE</button>');$('again').onclick=start}
function update(dt){t+=dt;if(mode!=='play')return;player.inv=Math.max(0,player.inv-dt);pulseCD=Math.max(0,pulseCD-dt);shake=Math.max(0,shake-dt*30);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){let vx=pointer.x-player.x,vy=pointer.y-player.y,l=Math.hypot(vx,vy);if(l>5){dx=vx/l;dy=vy/l;let s=Math.min(l,player.speed*dt);player.x+=dx*s;player.y+=dy*s}}else{let l=Math.hypot(dx,dy)||1;player.x+=dx/l*player.speed*dt;player.y+=dy/l*player.speed*dt}player.x=Math.max(15,Math.min(W-15,player.x));player.y=Math.max(75,Math.min(H-70,player.y));spawn-=dt;if(spawn<=0&&kills+enemies.length<target&&enemies.length<90){enemy();spawn=Math.max(.13,.8-wave*.045)}fire-=dt;if(fire<=0&&enemies.length){let nearest=enemies.reduce((a,b)=>distance(a,player)<distance(b,player)?a:b),angle=Math.atan2(nearest.y-player.y,nearest.x-player.x);for(let i=0;i<player.multi;i++){let a=angle+(i-(player.multi-1)/2)*.13;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:1.5})}fire=player.rate;tone(650,.035)}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies)if(e.hp>0&&distance(b,e)<e.r+5&&b.life>0){e.hp-=player.damage;b.life=0;burst(b.x,b.y,'#6fffe0',3)}}bullets=bullets.filter(b=>b.life>0);for(let e of enemies){e.angle+=dt;let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*(1+wave*.04)*dt;e.y+=Math.sin(a)*e.speed*(1+wave*.04)*dt;if(distance(e,player)<e.r+12&&player.inv<=0){player.hp-=e.boss?30:15;player.inv=1;shake=9;burst(player.x,player.y,'#ff507d',30);tone(80,.2)}if(e.hp<=0){kills++;score+=e.boss?1200:50+wave*5;burst(e.x,e.y,e.boss?'#ffca65':'#ff5894',e.boss?130:25);gems.push({x:e.x,y:e.y,life:15});if(e.boss)for(let j=0;j<12;j++)gems.push({x:e.x+rand(-70,70),y:e.y+rand(-70,70),life:15})}}enemies=enemies.filter(e=>e.hp>0);for(let gem of gems){gem.life-=dt;let d=distance(gem,player);if(d<95+player.shield){gem.x+=(player.x-gem.x)*dt*8;gem.y+=(player.y-gem.y)*dt*8}if(d<18){gem.life=0;score+=20;player.hp=Math.min(player.max,player.hp+1.5)}}gems=gems.filter(e=>e.life>0);if(player.hp<=0)end();else if(kills>=target&&enemies.length===0){transition+=dt;$('notice').textContent='SECTOR CLEAR · REACTOR EVOLVING';if(transition>1.2)next()}}
function draw(dt){g.fillStyle='#050912';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.7);bg.addColorStop(0,'#143042');bg.addColorStop(.5,'#0c172c');bg.addColorStop(1,'#050912');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.translate(rand(-shake,shake),rand(-shake,shake));g.strokeStyle='#39617f20';g.lineWidth=1;let offset=(t*16)%60;for(let x=-60;x<W+60;x+=60){g.beginPath();g.moveTo(x+offset,0);g.lineTo(x+offset,H);g.stroke()}for(let y=-60;y<H+60;y+=60){g.beginPath();g.moveTo(0,y+offset);g.lineTo(W,y+offset);g.stroke()}for(let s of stars){g.fillStyle='#93c3e8';g.globalAlpha=s.z*.6;g.fillRect(s.x,(s.y+t*s.z*12)%H,s.z*2,s.z*2)}g.globalAlpha=1;for(let i=0;i<q*35;i++){let a=i*2.399+t*.06,r=80+(i*23)%(Math.max(W,H)*.65),x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;g.fillStyle=i%2?'#1c9ea01c':'#614abb22';g.beginPath();g.arc(x,y,2+Math.sin(t+i)*1.2,0,7);g.fill()}g.shadowBlur=q===1?0:16;for(let gem of gems){g.fillStyle=g.shadowColor='#8affdb';g.save();g.translate(gem.x,gem.y);g.rotate(t);g.fillRect(-3,-3,6,6);g.restore()}for(let e of enemies){let color=e.boss?'#ffc76c':e.type===1?'#b493ff':'#ff5085';g.shadowColor=color;g.strokeStyle=color;g.fillStyle='#30162d';g.lineWidth=2;g.beginPath();let n=e.boss?10:e.type===2?4:3;for(let i=0;i<=n;i++){let a=i/n*Math.PI*2+e.angle*.7;g.lineTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r)}g.closePath();g.fill();g.stroke();g.fillStyle=color;g.beginPath();g.arc(e.x,e.y,e.boss?10:4,0,7);g.fill();if(e.boss){g.fillRect(e.x-40,e.y-57,80*e.hp/e.max,4)}}g.shadowColor='#8bffea';g.strokeStyle='#aeffed';g.lineWidth=3;for(let b of bullets){g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.022,b.y-b.vy*.022);g.stroke()}for(let s of sparks){if(mode==='play'||mode==='dead'||mode==='menu'){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.98;s.vy*=.98}g.globalAlpha=Math.max(0,Math.min(1,s.life*2));g.fillStyle=s.color;g.fillRect(s.x,s.y,2,2)}sparks=sparks.filter(s=>s.life>0);g.globalAlpha=1;for(let r of rings){if(mode==='play'){r.r+=dt*600;r.life-=dt}g.strokeStyle='#b3ffef';g.lineWidth=4;g.globalAlpha=Math.max(0,r.life);g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke()}rings=rings.filter(r=>r.life>0);g.globalAlpha=1;let p=player||{x:W/2,y:H/2,inv:0};g.translate(p.x,p.y);g.rotate(t*.8);g.shadowBlur=25;g.shadowColor='#62ffe0';g.strokeStyle='#72ffe4';g.lineWidth=2;g.beginPath();g.arc(0,0,22+Math.sin(t*4)*2,0,7);g.stroke();g.rotate(-t*.8);
// Original Storm Manta spacecraft: armored wings, twin engines, luminous reactor.
let flash=p.inv>0&&Math.floor(t*12)%2;
for(let side of [-1,1]){
 let flame=14+Math.sin(t*32)*5;
 let plume=g.createLinearGradient(0,10,0,40);
 plume.addColorStop(0,'#aaffef');plume.addColorStop(.35,'#21dfff');plume.addColorStop(1,'#21dfff00');
 g.fillStyle=plume;g.beginPath();g.moveTo(side*15-4,11);g.quadraticCurveTo(side*15-7,23,side*15,18+flame);g.quadraticCurveTo(side*15+7,23,side*15+4,11);g.fill();
 let armor=g.createLinearGradient(-28,-20,28,20);armor.addColorStop(0,'#466579');armor.addColorStop(.5,'#d3eef2');armor.addColorStop(1,'#23374e');
 g.fillStyle=flash?'#ffffff':armor;g.strokeStyle='#73ffe4';g.lineWidth=1.2;
 g.beginPath();g.moveTo(side*5,-14);g.lineTo(side*17,-20);g.lineTo(side*30,6);g.lineTo(side*26,16);g.lineTo(side*10,10);g.closePath();g.fill();g.stroke();
 g.fillStyle='#101e30';g.beginPath();g.moveTo(side*14,-11);g.lineTo(side*24,7);g.lineTo(side*15,4);g.closePath();g.fill();
 g.fillStyle='#5dfce2';g.fillRect(side*15-3,8,6,5);
}
let hull=g.createLinearGradient(-9,0,9,0);hull.addColorStop(0,'#28465a');hull.addColorStop(.5,'#cce6ea');hull.addColorStop(1,'#294659');
g.fillStyle=flash?'#ffffff':hull;g.strokeStyle='#a1ffee';g.beginPath();g.moveTo(0,-24);g.bezierCurveTo(8,-16,11,1,8,15);g.lineTo(0,20);g.lineTo(-8,15);g.bezierCurveTo(-11,1,-8,-16,0,-24);g.fill();g.stroke();
g.fillStyle='#09182c';g.beginPath();g.ellipse(0,-11,4.5,8,0,0,7);g.fill();g.strokeStyle='#53dbff';g.stroke();
g.shadowColor='#70ffdb';g.shadowBlur=20;g.fillStyle='#98ffe7';g.beginPath();g.arc(0,5,4.5+Math.sin(t*7)*.6,0,7);g.fill();g.strokeStyle='#174859';g.lineWidth=2;g.beginPath();g.arc(0,5,7,0,7);g.stroke();
g.restore();fps=fps*.95+(1/Math.max(dt,.001))*.05;$('stats').innerHTML='WAVE '+wave+' · '+Math.floor(score).toLocaleString()+'<br><small>'+Math.floor(fps)+' FPS · '+enemies.length+' hunters</small>';$('fill').style.width=(player?Math.max(0,player.hp/player.max*100):100)+'%';$('pulse').textContent=pulseCD>0?'PULSE '+Math.ceil(pulseCD)+'s':'PULSE READY';$('pulse').style.opacity=pulseCD>0?.55:1;if(mode==='play'&&transition===0&&t%8<.02)$('notice').textContent=wave%5===0?'LEVIATHAN SECTOR':'WAVE '+wave+' · '+kills+' / '+target}
function frame(now){let dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw(dt);requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});menu();requestAnimationFrame(frame);
